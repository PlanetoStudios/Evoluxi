<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Evolux</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120022">

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#080010;
  touch-action:none;
  font-family:Arial, sans-serif;
}
canvas{display:block}

/* UI */
#hud{
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.4);
  padding:10px;
  border-radius:10px;
  color:#0ff;
  font-size:14px;
}
#attack{
  position:fixed;
  right:30px;
  bottom:40px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:radial-gradient(#ff0080,#600020);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Evolution Menu */
#evolution{
  position:fixed;
  inset:0;
  background:rgba(5,0,10,0.95);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#0ff;
}
.evoBtn{
  margin:10px;
  padding:15px 30px;
  border:1px solid #0ff;
  border-radius:10px;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="hud"></div>
<div id="attack">ATAQUE</div>

<div id="evolution">
  <h2>EVOLUÇÃO</h2>
  <div class="evoBtn" onclick="choose('speed')">+ Velocidade</div>
  <div class="evoBtn" onclick="choose('spikes')">Espinhos</div>
  <div class="evoBtn" onclick="choose('poison')">Veneno</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener("resize",resize);

// ===== CAMERA =====
const camera={x:0,y:0};

// ===== PLAYER =====
const player={
  x:0,y:0,r:18,
  speed:2,dx:0,dy:0,
  xp:0,hp:100,
  evoPoints:0,
  abilities:{speed:0,spikes:false,poison:false}
};

// ===== WORLD =====
const cells=[];
const enemies=[];
function spawnCell(){
  cells.push({
    x:Math.random()*3000-1500,
    y:Math.random()*3000-1500,
    r:6,
    pulse:Math.random()*Math.PI*2
  });
}
for(let i=0;i<120;i++)spawnCell();

function spawnEnemy(){
  enemies.push({
    x:Math.random()*3000-1500,
    y:Math.random()*3000-1500,
    r:16,
    hp:40,
    speed:1.3
  });
}
for(let i=0;i<15;i++)spawnEnemy();

// ===== INPUT =====
let joy={x:0,y:0};
canvas.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  joy.x=(t.clientX-innerWidth/2)/100;
  joy.y=(t.clientY-innerHeight/2)/100;
});
canvas.addEventListener("touchend",()=>joy.x=joy.y=0);

// ===== ATTACK =====
document.getElementById("attack").ontouchstart=()=>{
  enemies.forEach(en=>{
    const d=Math.hypot(player.x-en.x,player.y-en.y);
    if(d<50){
      en.hp-=player.abilities.poison?20:10;
    }
  });
};

// ===== EVOLUTION =====
function choose(type){
  if(type==="speed")player.abilities.speed+=0.5;
  if(type==="spikes")player.abilities.spikes=true;
  if(type==="poison")player.abilities.poison=true;
  document.getElementById("evolution").style.display="none";
}

// ===== UPDATE =====
function update(){
  player.x+=joy.x*(player.speed+player.abilities.speed);
  player.y+=joy.y*(player.speed+player.abilities.speed);

  camera.x=player.x-canvas.width/2;
  camera.y=player.y-canvas.height/2;

  // Cells
  for(let i=cells.length-1;i>=0;i--){
    const c=cells[i];
    if(Math.hypot(player.x-c.x,player.y-c.y)<player.r){
      cells.splice(i,1);
      spawnCell();
      player.xp++;
      if(player.xp%10===0){
        player.evoPoints++;
        document.getElementById("evolution").style.display="flex";
      }
    }
  }

  // Enemies AI
  enemies.forEach(e=>{
    const d=Math.hypot(player.x-e.x,player.y-e.y);
    if(d<250){
      e.x+=(player.x-e.x)/d*e.speed;
      e.y+=(player.y-e.y)/d*e.speed;
    }
    if(d<player.r+e.r){
      player.hp-=0.4;
      if(player.abilities.spikes)e.hp-=0.6;
    }
  });

  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].hp<=0){
      enemies.splice(i,1);
      spawnEnemy();
    }
  }
}

// ===== DRAW =====
function drawBackground(){
  for(let x=-2000;x<2000;x+=80){
    for(let y=-2000;y<2000;y+=80){
      ctx.fillStyle="rgba(80,0,120,0.15)";
      ctx.beginPath();
      ctx.arc(x,y,Math.sin((x+y)/200)*5+20,0,Math.PI*2);
      ctx.fill();
    }
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  drawBackground();

  // Cells
  cells.forEach(c=>{
    c.pulse+=0.1;
    ctx.fillStyle="#00ff99";
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r+Math.sin(c.pulse)*2,0,Math.PI*2);
    ctx.fill();
  });

  // Enemies
  enemies.forEach(e=>{
    ctx.fillStyle="#ff0044";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#000";
    ctx.beginPath();
    ctx.arc(e.x+5,e.y-4,3,0,Math.PI*2);
    ctx.fill();
  });

  // Player sprite
  ctx.fillStyle="#00ffff";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#003333";
  ctx.beginPath();
  ctx.arc(player.x+6,player.y-4,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  document.getElementById("hud").innerHTML=
    `Evolux<br>XP: ${player.xp}<br>HP: ${Math.floor(player.hp)}`;
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== PWA =====
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
