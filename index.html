<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Evolux</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#120022">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: radial-gradient(#180033, #05000a);
  touch-action: none;
}

canvas { display: block; }

/* UI */
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: #fff;
  font-family: sans-serif;
}

/* Joystick */
#joystick {
  position: fixed;
  bottom: 30px;
  left: 30px;
  width: 120px;
  height: 120px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
#stick {
  position: absolute;
  left: 40px;
  top: 40px;
  width: 40px;
  height: 40px;
  background: #00ffee;
  border-radius: 50%;
}

/* Attack Button */
#attack {
  position: fixed;
  bottom: 40px;
  right: 40px;
  width: 80px;
  height: 80px;
  background: rgba(255,0,80,0.8);
  border-radius: 50%;
  color: white;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="ui"></div>

<div id="joystick"><div id="stick"></div></div>
<div id="attack">ATAQUE</div>

<script>
// ===== CANVAS & CAMERA =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const camera = { x: 0, y: 0 };

// ===== PLAYER =====
const player = {
  x: 0,
  y: 0,
  r: 14,
  speed: 2,
  dx: 0,
  dy: 0,
  xp: 0,
  hp: 100,
  stage: "Célula",
  abilities: {
    speed: 0,
    spikes: false,
    poison: false
  }
};

// ===== INIMIGOS (IA) =====
const enemies = [];
for (let i = 0; i < 15; i++) spawnEnemy();

function spawnEnemy(){
  enemies.push({
    x: Math.random()*2000 - 1000,
    y: Math.random()*2000 - 1000,
    r: 12,
    hp: 30,
    speed: 1.2
  });
}

// ===== FOOD =====
const food = [];
function spawnFood(){
  food.push({
    x: Math.random()*2000 - 1000,
    y: Math.random()*2000 - 1000,
    r: 4
  });
}
for(let i=0;i<80;i++) spawnFood();

// ===== JOYSTICK =====
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
let dragging=false;

joystick.addEventListener("touchstart",()=>dragging=true);
joystick.addEventListener("touchmove",e=>{
  if(!dragging)return;
  const r=joystick.getBoundingClientRect();
  const t=e.touches[0];
  let x=t.clientX-r.left-60;
  let y=t.clientY-r.top-60;
  const d=Math.hypot(x,y);
  if(d>40){x*=40/d;y*=40/d;}
  stick.style.left=x+40+"px";
  stick.style.top=y+40+"px";
  player.dx=x/40;
  player.dy=y/40;
});
joystick.addEventListener("touchend",()=>{
  dragging=false;
  stick.style.left="40px";
  stick.style.top="40px";
  player.dx=player.dy=0;
});

// ===== ATTACK =====
document.getElementById("attack").addEventListener("touchstart",()=>{
  enemies.forEach(e=>{
    const d=Math.hypot(player.x-e.x,player.y-e.y);
    if(d<player.r+25){
      e.hp-=player.abilities.poison?20:10;
    }
  });
});

// ===== UPDATE =====
function update(){
  player.x+=player.dx*(player.speed+player.abilities.speed);
  player.y+=player.dy*(player.speed+player.abilities.speed);

  camera.x=player.x-canvas.width/2;
  camera.y=player.y-canvas.height/2;

  // Comer
  for(let i=food.length-1;i>=0;i--){
    const f=food[i];
    if(Math.hypot(player.x-f.x,player.y-f.y)<player.r){
      food.splice(i,1);
      player.xp++;
      spawnFood();
      if(player.xp%5===0) player.r+=0.6;
    }
  }

  // Evolução
  if(player.xp===20){ player.stage="Criatura"; player.abilities.speed=1; }
  if(player.xp===40){ player.stage="Tribo"; player.abilities.spikes=true; }

  // IA inimigos
  enemies.forEach(e=>{
    const d=Math.hypot(player.x-e.x,player.y-e.y);
    if(d<200){
      e.x+=(player.x-e.x)/d*e.speed;
      e.y+=(player.y-e.y)/d*e.speed;
    }
    if(d<player.r+e.r){
      player.hp-=0.3;
      if(player.abilities.spikes) e.hp-=0.5;
    }
  });

  // Remover mortos
  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].hp<=0){
      enemies.splice(i,1);
      spawnEnemy();
    }
  }
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  // Food
  ctx.fillStyle="#00ff99";
  food.forEach(f=>{
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  });

  // Enemies
  ctx.fillStyle="#ff0066";
  enemies.forEach(e=>{
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
  });

  // Player
  ctx.fillStyle="#00ffff";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  document.getElementById("ui").innerHTML =
    `Evolux<br>
     Fase: ${player.stage}<br>
     XP: ${player.xp}<br>
     HP: ${Math.floor(player.hp)}`;
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// ===== PWA =====
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
